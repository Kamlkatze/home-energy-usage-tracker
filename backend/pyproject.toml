[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-energy-tracker"
version = "0.1.0"
description = "Home Energy Usage Tracker API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.1,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "python-multipart>=0.0.6,<1.0.0",
    "asyncpg>=0.30.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
dependencies = []

[tool.hatch.envs.dev]
features = ["dev"]

[tool.hatch.envs.test]
features = ["test"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.21.0,<2.0",
    "httpx>=0.25.0,<1.0",
    "ruff>=0.1.0,<1.0",
    "mypy>=1.7.0,<3.0",
    "eralchemy2>=1.4.1,<2.0",
]
test = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.21.0,<2.0",
    "httpx>=0.25.0,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]

# B008 is a known false positive for FastAPI `Query`/`Depends`/`Body` defaults;
# see https://github.com/astral-sh/ruff/issues/2258 for context. The exception is
# scoped to the API routers where FastAPI parameter defaults live.
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true