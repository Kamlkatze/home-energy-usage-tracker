services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energy_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Passwort erforderlich}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.dockerdata/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-energy_tracker}
      DATABASE_URL_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-energy_tracker}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      PROJECT_NAME: ${PROJECT_NAME:-Home Energy Usage Tracker}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3500"]}
    command: >
      sh -c "
        /opt/venv/bin/python -m alembic upgrade head &&
        exec /opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    ports:
      - "3500:80"
    restart: unless-stopped

networks:
  default:
    name: energy-net
    external: true
